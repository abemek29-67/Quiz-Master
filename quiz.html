<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master Quiz Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo">
                Quiz Master ⭐
            </div>
            <nav class="nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="features.html">Features</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link" href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="features-section">
            <div class="container">
                <h1 class="section-title">
                    Quiz Center
                </h1>

                <p class="quiz-description">
                    Are you ready for a challenging trivia quiz?
                    Buckle up for this intense rollercoaster of questions!
                    Be confident and remember to do your best!
                </p>

                <div class="cards-grid">

                    <div class="info-card">
                        <h2 class="card-title">Previous Score</h2>
                        <p class="card-text">0%</p>
                    </div>

                    <div class="info-card">
                        <h2 class="card-title">High Score</h2>
                        <p class="card-text">0%</p>
                    </div>

                    <div class="info-card">
                        <h2 class="card-title">Number of Attempts</h2>
                        <p class="card-text">0</p>
                    </div>

                </div>

                <div class="quiz-btn-container">

                    <button class="btn btn-primary">
                        Start Now
                    </button>

                </div>

            </div>

        </section>
    </main>
</body>
</html>
